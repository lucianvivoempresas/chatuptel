name: voltconect-chat

x-chatwoot: &chatwoot
  image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.9.2-ce}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD não definido}@redis:6379
    FRONTEND_URL: ${FRONTEND_URL:-https://chat.voltconect.com.br}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE não definido}
    ACTIVE_STORAGE_SERVICE: local
    FORCE_SSL: "false"
  volumes:
    - chatwoot_storage:/app/storage
  networks:
    - app
  restart: unless-stopped

services:
  rails:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e \"exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/api')).is_a?(Net::HTTPSuccess) ? 0 : 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  sidekiq:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD não definido}
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wppconnect:
    build:
      context: ./wppconnect
      args:
        WPP_VERSION: v2.10.0
    environment:
      WPP_SECRET_KEY: ${WPP_SECRET_KEY:?WPP_SECRET_KEY não definido}
      WPP_DEVICE_NAME: ${WPP_DEVICE_NAME:-Volt Conect Atendimento}
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_userdata:/usr/src/wpp-server/userDataDir
      - wppconnect_logs:/usr/src/wpp-server/log
    ports:
      # Administração somente por SSH/túnel local; nunca exponha 21465 publicamente.
      - "127.0.0.1:21465:21465"
    networks:
      - app
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:21465/api-docs/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  chatwoot_storage:
  postgres_data:
  redis_data:
  wppconnect_tokens:
  wppconnect_userdata:
  wppconnect_logs:

