name: voltconect-chat

x-chatwoot: &chatwoot
  image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.17.0-ce}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD não definido}@redis:6379
    FRONTEND_URL: ${FRONTEND_URL:-https://chat.voltconect.com.br}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE não definido}
    ACTIVE_STORAGE_SERVICE: local
    FORCE_SSL: "false"
  volumes:
    - chatwoot_storage:/app/storage
    - ./branding/uptel-conecta-logo.svg:/app/public/brand-assets/logo.svg:ro
    - ./branding/uptel-conecta-logo-dark.svg:/app/public/brand-assets/logo_dark.svg:ro
    - ./branding/uptel-conecta-thumbnail.svg:/app/public/brand-assets/logo_thumbnail.svg:ro
  networks:
    - app
  restart: unless-stopped

services:
  rails:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e \"exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/api')).is_a?(Net::HTTPSuccess) ? 0 : 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  sidekiq:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD não definido}
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  baileys:
    image: voltconnect-chat-baileys:local
    build:
      context: ./baileys
    depends_on:
      rails:
        condition: service_healthy
    environment:
      BAILEYS_ADMIN_TOKEN: ${BAILEYS_ADMIN_TOKEN:?BAILEYS_ADMIN_TOKEN não definido}
      CHATWOOT_URL: http://rails:3000
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:?CHATWOOT_ACCOUNT_ID não definido}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:?CHATWOOT_INBOX_ID não definido}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:?CHATWOOT_API_TOKEN não definido}
      CHATWOOT_BOT_API_TOKEN: ${CHATWOOT_BOT_API_TOKEN:-}
      CHATWOOT_BOT_USER_ID: ${CHATWOOT_BOT_USER_ID:-0}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-55}
      WHATSAPP_PREFIX_AGENT_NAME: ${WHATSAPP_PREFIX_AGENT_NAME:-true}
      WHATSAPP_BOT_ENABLED: ${WHATSAPP_BOT_ENABLED:-true}
      BAILEYS_AUDIT_RETENTION_DAYS: ${BAILEYS_AUDIT_RETENTION_DAYS:-90}
      WHATSAPP_GLOBAL_PER_MINUTE: ${WHATSAPP_GLOBAL_PER_MINUTE:-60}
      WHATSAPP_RECIPIENT_PER_MINUTE: ${WHATSAPP_RECIPIENT_PER_MINUTE:-10}
      WHATSAPP_AGENT_DAILY_LIMIT: ${WHATSAPP_AGENT_DAILY_LIMIT:-500}
      WHATSAPP_HISTORY_SYNC_DAYS: ${WHATSAPP_HISTORY_SYNC_DAYS:-0}
      CHATWOOT_POLL_INTERVAL_MS: ${CHATWOOT_POLL_INTERVAL_MS:-3000}
      ENERGIA_CRM_URL: ${ENERGIA_CRM_URL:-}
      ENERGIA_CRM_INTEGRATION_TOKEN: ${ENERGIA_CRM_INTEGRATION_TOKEN:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_INVOICE_MODEL: ${GEMINI_INVOICE_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INVOICE_MODEL: ${OPENAI_INVOICE_MODEL:-gpt-4.1-mini}
      OPENAI_INVOICE_MAX_OUTPUT_TOKENS: ${OPENAI_INVOICE_MAX_OUTPUT_TOKENS:-800}
      ENERGY_INVOICE_MAX_BYTES: ${ENERGY_INVOICE_MAX_BYTES:-15728640}
      SDR_AI_MAX_CALLS_PER_CONVERSATION: ${SDR_AI_MAX_CALLS_PER_CONVERSATION:-12}
      SDR_AI_MAX_TOKENS_PER_CONVERSATION: ${SDR_AI_MAX_TOKENS_PER_CONVERSATION:-60000}
      SDR_AI_MAX_COST_USD_PER_CONVERSATION: ${SDR_AI_MAX_COST_USD_PER_CONVERSATION:-0.05}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - baileys_data:/data
    ports:
      # Administração somente pelo servidor; nunca exponha esta porta publicamente.
      - "127.0.0.1:3001:3001"
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  assistant:
    build:
      context: ./assistant
    depends_on:
      rails:
        condition: service_healthy
    environment:
      PORT: 3002
      CHATWOOT_URL: http://rails:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASSISTANT_AI_PROVIDER: ${ASSISTANT_AI_PROVIDER:-openai}
      ASSISTANT_AI_BASE_URL: ${ASSISTANT_AI_BASE_URL:-https://api.openai.com/v1}
      ASSISTANT_AI_MODEL: ${ASSISTANT_AI_MODEL:-gpt-5.6-luna}
      ASSISTANT_AI_MAX_OUTPUT_TOKENS: ${ASSISTANT_AI_MAX_OUTPUT_TOKENS:-450}
      ASSISTANT_AI_REASONING_EFFORT: ${ASSISTANT_AI_REASONING_EFFORT:-low}
      ASSISTANT_AI_INPUT_COST_PER_MILLION: ${ASSISTANT_AI_INPUT_COST_PER_MILLION:-0.20}
      ASSISTANT_AI_CACHED_INPUT_COST_PER_MILLION: ${ASSISTANT_AI_CACHED_INPUT_COST_PER_MILLION:-0.02}
      ASSISTANT_AI_OUTPUT_COST_PER_MILLION: ${ASSISTANT_AI_OUTPUT_COST_PER_MILLION:-1.20}
      ASSISTANT_MAX_CONTEXT_MESSAGES: ${ASSISTANT_MAX_CONTEXT_MESSAGES:-6}
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-800}
      ASSISTANT_KNOWLEDGE_MAX_RESULTS: ${ASSISTANT_KNOWLEDGE_MAX_RESULTS:-3}
      ASSISTANT_KNOWLEDGE_MAX_CHARS: ${ASSISTANT_KNOWLEDGE_MAX_CHARS:-3500}
      ASSISTANT_MAX_AI_CALLS_PER_CONVERSATION: ${ASSISTANT_MAX_AI_CALLS_PER_CONVERSATION:-20}
      ASSISTANT_MAX_AI_TOKENS_PER_CONVERSATION: ${ASSISTANT_MAX_AI_TOKENS_PER_CONVERSATION:-80000}
      ASSISTANT_MAX_AI_COST_USD_PER_CONVERSATION: ${ASSISTANT_MAX_AI_COST_USD_PER_CONVERSATION:-0.05}
      ASSISTANT_USAGE_STATE_FILE: /data/usage.json
      ZYLOO_API_KEY: ${ZYLOO_API_KEY:-}
      ZYLOO_BASE_URL: ${ZYLOO_BASE_URL:-https://api.zyloo.io/v1}
      ZYLOO_MODEL: ${ZYLOO_MODEL:-zyloo/gpt-4.1}
      ZYLOO_MAX_TOKENS: ${ZYLOO_MAX_TOKENS:-700}
      ASSISTANT_RATE_LIMIT_PER_MINUTE: ${ASSISTANT_RATE_LIMIT_PER_MINUTE:-20}
      KNOWLEDGE_BASE_DIR: ${KNOWLEDGE_BASE_DIR:-/app/knowledge}
    ports:
      # O navegador acessa pelo Nginx; a porta permanece privada no servidor.
      - "127.0.0.1:3002:3002"
    networks:
      - app
    volumes:
      # Conteúdo comercial versionado e somente leitura. Atualizações de texto
      # não reiniciam nem modificam o Chatwoot ou o gateway do WhatsApp.
      - ./knowledge:/app/knowledge:ro
      - assistant_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  chatwoot_storage:
  postgres_data:
  redis_data:
  baileys_data:
  assistant_data:
