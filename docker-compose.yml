name: voltconect-chat

x-chatwoot: &chatwoot
  image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.9.2-ce}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD não definido}@redis:6379
    FRONTEND_URL: ${FRONTEND_URL:-https://chat.voltconect.com.br}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE não definido}
    ACTIVE_STORAGE_SERVICE: local
    FORCE_SSL: "false"
  volumes:
    - chatwoot_storage:/app/storage
    - ./branding/uptel-conecta-logo.svg:/app/public/brand-assets/logo.svg:ro
    - ./branding/uptel-conecta-logo-dark.svg:/app/public/brand-assets/logo_dark.svg:ro
    - ./branding/uptel-conecta-thumbnail.svg:/app/public/brand-assets/logo_thumbnail.svg:ro
  networks:
    - app
  restart: unless-stopped

services:
  rails:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e \"exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/api')).is_a?(Net::HTTPSuccess) ? 0 : 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  sidekiq:
    <<: *chatwoot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD não definido}
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  baileys:
    build:
      context: ./baileys
    depends_on:
      rails:
        condition: service_healthy
    environment:
      BAILEYS_ADMIN_TOKEN: ${BAILEYS_ADMIN_TOKEN:?BAILEYS_ADMIN_TOKEN não definido}
      CHATWOOT_URL: http://rails:3000
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:?CHATWOOT_ACCOUNT_ID não definido}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:?CHATWOOT_INBOX_ID não definido}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:?CHATWOOT_API_TOKEN não definido}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-55}
      WHATSAPP_PREFIX_AGENT_NAME: ${WHATSAPP_PREFIX_AGENT_NAME:-true}
      WHATSAPP_BOT_ENABLED: ${WHATSAPP_BOT_ENABLED:-true}
      ENERGIA_CRM_URL: ${ENERGIA_CRM_URL:-}
      ENERGIA_CRM_INTEGRATION_TOKEN: ${ENERGIA_CRM_INTEGRATION_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - baileys_data:/data
    ports:
      # Administração somente pelo servidor; nunca exponha esta porta publicamente.
      - "127.0.0.1:3001:3001"
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  chatwoot_storage:
  postgres_data:
  redis_data:
  baileys_data:
