# Adicione este bloco dentro do "server" HTTPS já existente de
# www.voltconect.com.br. O Chatwoot não é compatível de forma confiável
# com um prefixo de URL; por isso /chat redireciona para o subdomínio.
location = /chat {
    return 308 https://chat.voltconect.com.br/;
}

location = /chat/ {
    return 308 https://chat.voltconect.com.br/;
}

